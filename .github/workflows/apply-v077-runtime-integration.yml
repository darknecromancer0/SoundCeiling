name: Finalize v0.7.7 runtime integration
on:
  push:
    branches: [ "feature/v0.7-adaptive-envelope" ]
permissions:
  contents: write
jobs:
  finalize-runtime:
    if: github.actor == 'darknecromancer0'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v0.7-adaptive-envelope
          fetch-depth: 0
      - name: Clean runtime integration and verify invariants
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/dev/soundceiling/app/NormalizerService.java')
          s = p.read_text()
          bad = '''        if (decision.action == CaptureRequestCoordinator.Action.CLOSE) {\n            if (enhancedSessionDsp != null) enhancedSessionDsp.onCaptureReplaced();\n            if (enhancedSessionDsp != null) enhancedSessionDsp.onCaptureReplaced();\n        if (optionalDsp != null) optionalDsp.onCaptureReplaced();\n'''
          good = '''        if (decision.action == CaptureRequestCoordinator.Action.CLOSE) {\n            if (enhancedSessionDsp != null) enhancedSessionDsp.onCaptureReplaced();\n            if (optionalDsp != null) optionalDsp.onCaptureReplaced();\n'''
          if bad in s:
              s = s.replace(bad, good, 1)
          if s.count('enhancedSessionDsp.onCaptureReplaced();') != 2:
              raise SystemExit('unexpected enhanced capture lifecycle count')
          if 'enhancedSessionDsp.update(hybridSnapshot, blockRms, signal,' not in s:
              raise SystemExit('enhanced runtime update missing')
          if 'updateGlobalDspVerification(blockRms, signal' in s:
              raise SystemExit('session-zero verification still called by Smart PCM runtime')
          if '.ordinaryMediaFallbackAllowed(false)' not in s:
              raise SystemExit('ordinary Media fallback still enabled in v0.7.7 service')
          if '.globalMixDsp(false)' not in s:
              raise SystemExit('session-zero global mix still framed as runtime authority')
          p.write_text(s)
          PY
          bash ./scripts/run-pure-tests.sh
          bash ./scripts/run-v077-session-tests.sh
          ./gradlew --no-daemon :app:compileDebugJavaWithJavac
      - name: Persist cleanup and remove one-shot workflow
        run: |
          git config user.name "darknecromancer0"
          git config user.email "127566984+darknecromancer0@users.noreply.github.com"
          git rm .github/workflows/apply-v077-runtime-integration.yml
          git add app/src/main/java/dev/soundceiling/app/NormalizerService.java
          git commit -m "fix: finalize v0.7.7 session DSP runtime integration"
          git push origin HEAD:feature/v0.7-adaptive-envelope
