name: Materialize Task 10 exact sources
on:
  push:
    branches: [ "feature/v0.7-adaptive-envelope" ]
permissions:
  contents: write
jobs:
  materialize:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply exact Task 10 patch and self-remove
        shell: bash
        run: |
          set -euo pipefail
          cat .task10/patch.00 .task10/patch.01 \
              .task10/p00 \
              .task10/p01_00 .task10/p01_01 .task10/p01_02 .task10/p01_03 \
              .task10/p02_00 .task10/p02_01 .task10/p02_02 > /tmp/task10.patch
          test "$(git hash-object /tmp/task10.patch)" = "522abe4f6d6bc34510f4bb534b5afd0f10197d7b"
          git apply --exclude=scripts/run-pure-tests.sh /tmp/task10.patch

          check_hash(){ test "$(git hash-object "$2")" = "$1" || { echo "hash mismatch: $2" >&2; exit 1; }; }
          check_hash 07d09537cb4233753b93266c0a3fc297194f3a9c app/src/main/java/dev/soundceiling/app/AdvancedModeView.java
          check_hash da11da7b94c7b0b121a2da61f514e2ec4c2cebbf app/src/main/java/dev/soundceiling/app/CalibrationView.java
          check_hash 551a4091252e1c80fda7cad0691ab471f35b2e77 app/src/main/java/dev/soundceiling/app/DiagnosticsView.java
          check_hash 9e9b4bb87a4264a9fce031caa6a3526aeea27a43 app/src/main/java/dev/soundceiling/app/EqView.java
          check_hash 1cb01b0e1f3ee53a8d9caa40eb320d2dabafeee0 app/src/main/java/dev/soundceiling/app/EqVisualizationMath.java
          check_hash b0d0a1556253d7111947fc64c5c6c54a180764b0 app/src/main/java/dev/soundceiling/app/FrequencyMeterView.java
          check_hash ec720906514c2ccc07acbab57658a8b384eb5cc5 app/src/main/java/dev/soundceiling/app/GlobalVisualizerBackend.java
          check_hash 3df7776163461207068f33f2db38409f8f66da6d app/src/main/java/dev/soundceiling/app/MainActivity.java
          check_hash a127e9694c93de303518b2c939cb881f3259ba64 app/src/main/java/dev/soundceiling/app/NormalizerService.java
          check_hash ad023de96d32d090e18c13765763c23d8c1ff4a1 app/src/main/java/dev/soundceiling/app/Prefs.java
          check_hash eb73eef21e0b6dfaef76d5915084119456e00bc7 scripts/check-v07-adaptive-contract.sh
          check_hash a346e84cdd4d89d7bb5a192be40a61708eebbfc5 scripts/run-pure-tests.sh
          check_hash eab6371a8202de5ff747cbef8b37b01769e8e53c app/src/main/java/dev/soundceiling/app/CalibrationPreferenceState.java
          check_hash 0fa72503e944c416159dad2923f1cfc7b4565b97 app/src/main/java/dev/soundceiling/app/GlobalVisualizerReading.java
          check_hash 8cf993a3b4df0934c4d87f799f85954b06418f81 app/src/main/java/dev/soundceiling/app/VisualizerFftBands.java
          check_hash 3aea52ddc621f3ecee4255e96517d291ead64ba8 app/src/test/java/dev/soundceiling/app/V071VisualizerPureTest.java

          rm -rf .task10 .github/workflows/materialize-task10.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: restore fft fallback and calibration state"
          git push origin HEAD:feature/v0.7-adaptive-envelope
