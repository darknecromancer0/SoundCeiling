name: Materialize v0.7.7.6 Strict Safety
on:
  push:
    branches: [ "feature/v0.7-adaptive-envelope" ]
    paths:
      - ".github/materialize-v0776/**"
      - ".github/workflows/materialize-v0776.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v0.7-adaptive-envelope
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Extract reviewed source bundle
        run: |
          cat .github/materialize-v0776/chunk-*.b64 | base64 -d > /tmp/v0776-files.tar.gz
          tar -xzf /tmp/v0776-files.tar.gz
          git diff --check
      - name: Run pure regression suite
        run: ./scripts/run-pure-tests.sh
      - name: Run strict safety contracts
        run: |
          bash ./scripts/check-v06-one-way-contract.sh
          bash ./scripts/check-v07-adaptive-contract.sh
          bash ./scripts/check-v0773-release-contract.sh
          bash ./scripts/check-v0776-strict-safety-contract.sh
      - name: Commit materialized source
        run: |
          git config user.name "darknecromancer0"
          git config user.email "127566984+darknecromancer0@users.noreply.github.com"
          git add app scripts docs/field-tests
          git diff --cached --check
          git commit -m "fix: enforce v0.7.7.6 strict safety authority"
          git push origin HEAD:feature/v0.7-adaptive-envelope
