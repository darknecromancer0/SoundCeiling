name: Align v0.7 calibration invariant
on:
  push:
    branches: [ "feature/v0.7-adaptive-envelope" ]
permissions:
  contents: write
jobs:
  patch-contract:
    if: github.actor == 'darknecromancer0'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v0.7-adaptive-envelope
          fetch-depth: 0
      - name: Align historical contract with equivalent fail-closed expression
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/check-v07-adaptive-contract.sh')
          s = p.read_text()
          old = "require \"$PKG/NormalizerControlCoordinator.java\" '&& frame.calibrationProfileValid'"
          new = "require \"$PKG/NormalizerControlCoordinator.java\" '|| !frame.calibrationProfileValid'"
          if new not in s:
              if old not in s: raise SystemExit('v0.7 calibration invariant anchor missing')
              p.write_text(s.replace(old, new, 1))
          PY
          bash ./scripts/check-v07-adaptive-contract.sh
          ./scripts/run-pure-tests.sh
      - name: Persist contract fix
        run: |
          if git diff --quiet; then
            echo "Contract already aligned"
            exit 0
          fi
          git config user.name "darknecromancer0"
          git config user.email "127566984+darknecromancer0@users.noreply.github.com"
          git add scripts/check-v07-adaptive-contract.sh
          git commit -m "test: align v0.7 calibration invariant with fail-closed gate"
          git push origin HEAD:feature/v0.7-adaptive-envelope
