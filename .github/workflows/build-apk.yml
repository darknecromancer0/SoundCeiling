name: Materialize Sound Ceiling v0.7.3
on:
  pull_request:
    types: [synchronize]
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Materialize exact v0.7.3 patch
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f .task073/v073.patch ]]; then
            echo "v0.7.3 patch already materialized"
            exit 0
          fi
          git apply --check --exclude=.github/workflows/build-apk.yml .task073/v073.patch
          git apply --exclude=.github/workflows/build-apk.yml .task073/v073.patch
          ./scripts/run-pure-tests.sh
          for script in scripts/check-*.sh; do
            bash "$script"
          done
          rm -rf .task073
          git add -A
          if git diff --cached --quiet; then
            echo "No materialized changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: preserve user volume authority and dsp transport"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
