name: Build Sound Ceiling APK
on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Upload source snapshot for v0.7 development
        uses: actions/upload-artifact@v4
        with:
          name: SoundCeiling-v0.7-source-snapshot
          path: |
            .github
            app
            docs
            gradle
            scripts
            tests
            build.gradle.kts
            gradle.properties
            gradlew
            gradlew.bat
            settings.gradle.kts
          include-hidden-files: true
          if-no-files-found: error
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Restore stable dev debug keystore
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: soundceiling-debug-keystore-v1
      - name: Ensure stable dev debug keystore
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore ~/.android/debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=SoundCeiling Dev,O=SoundCeiling,C=US" \
              -keyalg RSA -keysize 2048 -validity 10000
          fi
      - name: Run pure logic tests
        run: ./scripts/run-pure-tests.sh
      - name: Check v0.4 storage contract
        run: bash ./scripts/check-v04-storage-contract.sh
      - name: Check v0.5 storage contract
        run: bash ./scripts/check-v05-storage-contract.sh
      - name: Check v0.5 app contract
        run: bash ./scripts/check-v05-app-contract.sh
      - name: Check source invariants
        run: ./scripts/check-source-invariants.sh
      - name: Check v0.6 one-way runtime contract
        run: bash ./scripts/check-v06-one-way-contract.sh
      - name: Check v0.7 adaptive envelope contract
        run: bash ./scripts/check-v07-adaptive-contract.sh
      - name: Check v0.7.1 DSP integration contract
        run: bash ./scripts/check-v071-dsp-contract.sh
      - name: Check v0.7.1 Simple/Advanced UI contract
        run: bash ./scripts/check-v071-ui-contract.sh
      - name: Check v0.7.1 release contract
        run: bash ./scripts/check-v071-release-contract.sh
      - name: Check v0.7.2 corrective architecture contract
        run: bash ./scripts/check-v072-corrective-contract.sh
      - name: Check v0.7.2 release contract
        run: bash ./scripts/check-v072-release-contract.sh
      - name: Check v0.7.3 corrective contract
        run: bash ./scripts/check-v073-corrective-contract.sh
      - name: Check v0.7.4 corrective contract
        run: bash ./scripts/check-v074-corrective-contract.sh
      - name: Check v0.7.3 release contract
        run: bash ./scripts/check-v073-release-contract.sh
      - name: Check v0.7.4 release contract
        run: bash ./scripts/check-v074-release-contract.sh
      - name: Check v0.7.4.1 stop lifecycle contract
        run: bash ./scripts/check-v0741-stop-contract.sh
      - name: Check v0.7.4.2 repeated stop/restart contract
        run: bash ./scripts/check-v0742-stop-restart-contract.sh
      - name: Check v0.7.5 low-volume linked fallback contract
        run: bash ./scripts/check-v075-low-volume-contract.sh
      - name: Check v0.7.5.1 peak floor contract
        run: bash ./scripts/check-v0751-peak-floor-contract.sh
      - name: Check v0.7.5.2 coarse recovery contract
        run: bash ./scripts/check-v0752-coarse-recovery-contract.sh
      - name: Check v0.7 UI contract
        run: bash ./scripts/check-v07-ui-contract.sh
      - name: Check v0.5 targeted PCM contract
        run: bash ./scripts/check-v05-pcm-contract.sh
      - name: Check v0.5 microphone isolation
        run: bash ./scripts/check-v05-microphone-invariant.sh
      - name: Check v0.5 control adapters
        run: bash ./scripts/check-v05-control-adapters.sh
      - name: Check legacy UI contract
        run: bash ./scripts/check-ui-contract.sh
      - name: Check v0.4 UI contract
        run: bash ./scripts/check-v04-ui-contract.sh
      - name: Check v0.5 UI contract
        run: bash ./scripts/check-v05-ui-contract.sh
      - name: Check v0.4 package contract
        run: bash ./scripts/check-v04-package-contract.sh
      - name: Check v0.5 release contract
        run: bash ./scripts/check-v05-release-contract.sh
      - name: Check v0.5.1 core stability contract
        run: bash ./scripts/check-v051-core-stability-contract.sh
      - name: Check v0.6 release contract
        run: bash ./scripts/check-v06-release-contract.sh
      - name: Check v0.7 release contract
        run: bash ./scripts/check-v07-release-contract.sh
      - name: Check v0.7.6 control architecture contract
        run: bash ./scripts/check-v076-control-architecture-contract.sh
      - name: Check v0.7.6 release contract
        run: bash ./scripts/check-v076-release-contract.sh
      - name: Check v0.7.6.1 DSP safety contract
        run: bash ./scripts/check-v0761-dsp-safety-contract.sh
      - name: Check v0.7.6.1 release contract
        run: bash ./scripts/check-v0761-release-contract.sh
      - name: Check v0.7.6.2 output-domain contract
        run: bash ./scripts/check-v0762-output-domain-contract.sh
      - name: Check v0.7.6.2 release contract
        run: bash ./scripts/check-v0762-release-contract.sh
      - name: Check v0.7.6.3 DSP attach evidence contract
        run: bash ./scripts/check-v0763-dsp-attach-evidence-contract.sh
      - name: Check v0.7.6.3 release contract
        run: bash ./scripts/check-v0763-release-contract.sh
      - name: Check v0.7.7 Samsung 3-of-15 authority
        run: bash ./scripts/run-v077-samsung-3of15-tests.sh
      - name: Check v0.7.7 Session DSP telemetry
        run: bash ./scripts/run-v077-session-telemetry-tests.sh
      - name: Check v0.7.7 Android wiring contract
        run: bash ./scripts/check-v077-android-wiring-contract.sh
      - name: Check v0.7.7 release contract
        run: bash ./scripts/check-v077-release-contract.sh
      - name: Check v0.7.7.1 neutral Session DSP topology contract
        run: bash ./scripts/check-v0771-neutral-session-probe-contract.sh
      - name: Check v0.7.7.1 deterministic readback pure test
        run: bash ./scripts/run-v0771-readback-tests.sh
      - name: Check v0.7.7.1 deterministic readback wiring
        run: bash ./scripts/check-v0771-readback-wiring-contract.sh
      - name: Check v0.7.7.1 release contract
        run: bash ./scripts/check-v0771-release-contract.sh
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        run: ./gradlew --no-daemon --stacktrace :app:assembleDebug
      - name: APK checksum
        working-directory: app/build/outputs/apk/debug
        run: sha256sum app-debug.apk | tee app-debug.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: SoundCeiling-v0.7.7.1-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
