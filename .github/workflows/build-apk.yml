name: Build Sound Ceiling APK
on:
  push:
    branches: [ "feature/v0.7-adaptive-envelope" ]
permissions:
  contents: write
jobs:
  build:
    if: "github.event.head_commit.message == 'ci: activate v0.7.7.7 materializer retry'"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v0.7-adaptive-envelope
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Reconstruct reviewed v0.7.7.7 patch
        run: |
          cat .tmp/v0777-core.b64.part* | base64 -d > /tmp/v0777-core.patch
          git apply --check /tmp/v0777-core.patch
          git apply /tmp/v0777-core.patch
          chmod +x scripts/check-v0777-preemptive-volume-up-contract.sh scripts/check-v0777-release-contract.sh
      - name: Verify v0.7.7.7 strict safety before commit
        run: |
          bash ./scripts/run-pure-tests.sh
          bash ./scripts/check-v0776-strict-safety-contract.sh
          bash ./scripts/check-v0777-preemptive-volume-up-contract.sh
      - name: Materialize source on feature branch
        run: |
          rm -f .tmp/v0777-core.b64.part*
          git config user.name 'SoundCeiling CI'
          git config user.email 'actions@users.noreply.github.com'
          git add -A app scripts .tmp
          git commit -m 'fix: preempt Samsung Volume-Up before hard cap'
          git push origin HEAD:feature/v0.7-adaptive-envelope
