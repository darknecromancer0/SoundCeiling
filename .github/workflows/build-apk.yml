name: Build Sound Ceiling APK
on:
  pull_request:
    branches: [ "main", "master" ]
permissions:
  contents: write
jobs:
  materialize-v072:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconstruct and apply exact v0.7.2 patch
        shell: bash
        run: |
          set -euo pipefail
          cat .task072/patch.* > /tmp/v072.patch
          actual=$(git hash-object /tmp/v072.patch)
          test "$actual" = "517fcf2726cf955ac8fa5cd058a76ef2ae3553ad" || { echo "patch hash mismatch: $actual"; exit 1; }
          git apply --check /tmp/v072.patch
          git apply /tmp/v072.patch
      - name: Verify exact GREEN file hashes
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object app/build.gradle.kts)" = "ca293107beef60b3efaf7b723900e4459cf06c03" || { echo "hash mismatch app/build.gradle.kts"; exit 1; }
          test "$(git hash-object app/src/main/java/dev/soundceiling/app/AdvancedModeView.java)" = "0c8b984e2734b5861743316bdb65cb4ac333ccd2" || { echo "hash mismatch app/src/main/java/dev/soundceiling/app/AdvancedModeView.java"; exit 1; }
