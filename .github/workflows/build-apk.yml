          test "$(git hash-object scripts/check-v06-one-way-contract.sh)" = "f2b1e31d6d5d7e01611d2bf272d220307dcb62f8" || { echo "hash mismatch scripts/check-v06-one-way-contract.sh"; exit 1; }
          test "$(git hash-object scripts/check-v07-adaptive-contract.sh)" = "232a9e602e845eb3c61b506e14bac73f67181518" || { echo "hash mismatch scripts/check-v07-adaptive-contract.sh"; exit 1; }
