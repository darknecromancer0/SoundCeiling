name: Apply v0.7.7 Session DSP Android telemetry
on:
  push:
    branches: [ "feature/v0.7-adaptive-envelope" ]
permissions:
  contents: write
jobs:
  apply-task6:
    if: github.actor == 'darknecromancer0'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v0.7-adaptive-envelope
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Wire Session DSP telemetry into Android runtime and UI
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new, label):
              p = Path(path)
              s = p.read_text()
              if new in s:
                  return
              if old not in s:
                  raise SystemExit(f'{label}: anchor missing')
              p.write_text(s.replace(old, new, 1))

          service = 'app/src/main/java/dev/soundceiling/app/NormalizerService.java'
          replace_once(service,
          '''        if (command.kind() == ControlCommand.Kind.DSP_GAIN) {
              boolean applied = optionalDsp != null && optionalDsp.applyGain(
                      command.requestedGainDb(), isSafetyCommand(command));
              DiagnosticLog.transition("dsp_gain_command", command.reason(),
                      "requestedGainDb=" + command.requestedGainDb() + " applied=" + applied);
              return current;
          }
          ''',
          '''        if (command.kind() == ControlCommand.Kind.DSP_GAIN) {
              int sessionBefore = optionalDsp == null ? -1 : optionalDsp.enhancedSessionId();
              boolean applied = optionalDsp != null && optionalDsp.applyGain(
                      command.requestedGainDb(), isSafetyCommand(command));
              float appliedGainDb = optionalDsp == null ? 0f : optionalDsp.appliedGainDb();
              DiagnosticLog.transition("dsp_gain_command", command.reason(),
                      "requestedGainDb=" + command.requestedGainDb() + " applied=" + applied);
              if (sessionBefore > 0) {
                  DiagnosticLog.transition("session_dsp_apply",
                          sessionBefore + ":" + command.requestedGainDb() + ":" + applied,
                          "session=" + sessionBefore + " requestedGainDb="
                                  + command.requestedGainDb() + " appliedGainDb=" + appliedGainDb
                                  + " applied=" + applied + " media=" + current);
                  if (!applied && enhancedSessionDsp != null) {
                      enhancedSessionDsp.onApplyFailed("session_dsp_apply_failed");
                  }
              }
              return current;
          }
          ''', 'service DSP apply')
          replace_once(service,
          '''                .profileName(currentProfileV2 != null ? currentProfileV2.name
                          : currentProfile == null ? "" : currentProfile.name)
                  .logStatus(logger == null ? "" : logger.status())
                  .unexpectedZero(unexpectedZeroThisPoll);
          ''',
          '''                .profileName(currentProfileV2 != null ? currentProfileV2.name
                          : currentProfile == null ? "" : currentProfile.name)
                  .logStatus(logger == null ? "" : logger.status())
                  .enhancedSession(enhancedSessionDsp != null && enhancedSessionDsp.permissionGranted(),
                          enhancedSessionDsp != null && enhancedSessionDsp.active(),
                          enhancedSessionDsp == null ? -1 : enhancedSessionDsp.sessionId(),
                          enhancedSessionDsp == null ? -1 : enhancedSessionDsp.sessionUid(),
                          enhancedSessionDsp == null ? "" : enhancedSessionDsp.sessionPackage(),
                          controlCoordinator.snapshot().desiredGainDb(),
                          optionalDsp == null ? 0f : optionalDsp.appliedGainDb(),
                          enhancedSessionDsp == null ? "session_runtime_missing"
                                  : enhancedSessionDsp.reason())
                  .unexpectedZero(unexpectedZeroThisPoll);
          ''', 'service state telemetry')

          simple = 'app/src/main/java/dev/soundceiling/app/SimpleModeView.java'
          replace_once(simple,
          '''import android.content.Context;
          import android.content.Intent;
          import android.provider.Settings;
          ''',
          '''import android.content.ClipData;
          import android.content.ClipboardManager;
          import android.content.Context;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.provider.Settings;
          ''', 'simple imports')
          replace_once(simple,
          '''    private final TextView globalStatus, linkedHint, lowerLabel, upperLabel, safetyLabel, normalizeLabel;
              private final SeekBar lowerSeek, upperSeek, safetySeek;
              private final Button startStop;
              private final Button sourceAccess;
          ''',
          '''    private final TextView globalStatus, linkedHint, lowerLabel, upperLabel, safetyLabel, normalizeLabel;
              private final TextView sessionDspSetupStatus;
              private final SeekBar lowerSeek, upperSeek, safetySeek;
              private final Button startStop;
              private final Button sourceAccess;
              private final Button copySessionDspCommand;
          ''', 'simple fields')
          replace_once(simple,
          '''        root.addView(statusCard, statusLp);

              sourceAccess = new Button(context);
          ''',
          '''        root.addView(statusCard, statusLp);

              sessionDspSetupStatus = secondary("", 13);
              sessionDspSetupStatus.setPadding(0, dp(2), 0, dp(6));
              root.addView(sessionDspSetupStatus);
              copySessionDspCommand = new Button(context);
              copySessionDspCommand.setAllCaps(false);
              copySessionDspCommand.setText("Копировать команду Enhanced Session DSP");
              copySessionDspCommand.setOnClickListener(v -> copyEnhancedSessionCommand());
              LinearLayout.LayoutParams setupLp = new LinearLayout.LayoutParams(
                      LayoutParams.MATCH_PARENT, dp(50));
              setupLp.bottomMargin = dp(8);
              root.addView(copySessionDspCommand, setupLp);

              sourceAccess = new Button(context);
          ''', 'simple setup block')
          replace_once(simple,
          '''    private SimpleModeModel model() {
              boolean active = runtime.dspTransportCapability
                      == EngineCapabilities.DspTransportCapability.VERIFIED_GLOBAL_MIX;
              return new SimpleModeModel(Prefs.outputCeilings(getContext()), curve, active,
                      Prefs.globalDspEnabled(getContext()), active);
          }
          ''',
          '''    private SimpleModeModel model() {
              boolean verified = runtime.sessionDspActive
                      || runtime.dspTransportCapability
                      == EngineCapabilities.DspTransportCapability.VERIFIED_POLICY_SCOPED
                      || runtime.dspTransportCapability
                      == EngineCapabilities.DspTransportCapability.VERIFIED_GLOBAL_MIX;
              boolean globalMixActive = runtime.dspTransportCapability
                      == EngineCapabilities.DspTransportCapability.VERIFIED_GLOBAL_MIX;
              return new SimpleModeModel(Prefs.outputCeilings(getContext()), curve, verified,
                      Prefs.globalDspEnabled(getContext()), globalMixActive);
          }
          ''', 'simple DSP status semantics')
          replace_once(simple,
          '''        sourceAccess.setVisibility(runtime.sourceAccessState == CaptureRequestCoordinator.SourceAccessState.ACCESS_MISSING
                      ? View.VISIBLE : View.GONE);
              refreshSharedControls();
          ''',
          '''        sourceAccess.setVisibility(runtime.sourceAccessState == CaptureRequestCoordinator.SourceAccessState.ACCESS_MISSING
                      ? View.VISIBLE : View.GONE);
              refreshEnhancedSessionSetup();
              refreshSharedControls();
          ''', 'simple render')
          replace_once(simple,
          '''    private void updateSafetyLabel(int percent) {
          ''',
          '''    private void refreshEnhancedSessionSetup() {
              boolean granted = getContext().checkSelfPermission(EnhancedSessionSetup.DUMP_PERMISSION)
                      == PackageManager.PERMISSION_GRANTED;
              if (!granted) {
                  sessionDspSetupStatus.setText(EnhancedSessionSetup.REQUIRED_STATUS + "\n"
                          + EnhancedSessionSetup.ADB_GRANT_COMMAND);
                  copySessionDspCommand.setVisibility(View.VISIBLE);
                  return;
              }
              copySessionDspCommand.setVisibility(View.GONE);
              sessionDspSetupStatus.setText(runtime.running
                      ? StatusText.sessionDsp(runtime)
                      : "Enhanced Session DSP permission granted · session discovery starts with playback");
          }

              private void copyEnhancedSessionCommand() {
              ClipboardManager clipboard = (ClipboardManager) getContext()
                      .getSystemService(Context.CLIPBOARD_SERVICE);
              if (clipboard != null) {
                  clipboard.setPrimaryClip(ClipData.newPlainText(
                          "SoundCeiling Enhanced Session DSP", EnhancedSessionSetup.ADB_GRANT_COMMAND));
              }
          }

              private void updateSafetyLabel(int percent) {
          ''', 'simple setup methods')

          advanced = 'app/src/main/java/dev/soundceiling/app/AdvancedModeView.java'
          replace_once(advanced,
          '''import android.app.AlertDialog;
          import android.content.Context;
          import android.graphics.Typeface;
          ''',
          '''import android.app.AlertDialog;
          import android.content.ClipData;
          import android.content.ClipboardManager;
          import android.content.Context;
          import android.content.pm.PackageManager;
          import android.graphics.Typeface;
          ''', 'advanced imports')
          replace_once(advanced,
          '''    private final TextView modeInfo, profileInfo, liveDetails, decisionDetails, globalDspStatus, linkedLockHint;
              private final Button startStop;
          ''',
          '''    private final TextView modeInfo, profileInfo, liveDetails, decisionDetails, globalDspStatus, linkedLockHint;
              private final TextView sessionDspSetupStatus;
              private final Button copySessionDspCommand;
              private final Button startStop;
          ''', 'advanced fields')
          replace_once(advanced,
          '''        statusCard = new StatusCardView(context); root.addView(statusCard,
                      new LinearLayout.LayoutParams(LayoutParams.MATCH_PARENT, LayoutParams.WRAP_CONTENT));

              section("Основной actuator");
          ''',
          '''        statusCard = new StatusCardView(context); root.addView(statusCard,
                      new LinearLayout.LayoutParams(LayoutParams.MATCH_PARENT, LayoutParams.WRAP_CONTENT));

              sessionDspSetupStatus = secondary("", 13);
              sessionDspSetupStatus.setPadding(0, dp(8), 0, dp(6));
              root.addView(sessionDspSetupStatus);
              copySessionDspCommand = button("Копировать команду Enhanced Session DSP");
              copySessionDspCommand.setOnClickListener(v -> copyEnhancedSessionCommand());
              root.addView(copySessionDspCommand, fullButton());

              section("Основной actuator");
          ''', 'advanced setup block')
          replace_once(advanced,
          '''        startStop.setText(runtime.running ? "Остановить" : "Запустить"); statusCard.render(runtime); frequencyMeter.renderState(runtime);
              refreshSharedOutputControls();
          ''',
          '''        startStop.setText(runtime.running ? "Остановить" : "Запустить"); statusCard.render(runtime); frequencyMeter.renderState(runtime);
              refreshEnhancedSessionSetup();
              refreshSharedOutputControls();
          ''', 'advanced render')
          replace_once(advanced,
          '''    private SimpleModeModel outputModel() {
              boolean active = runtime.dspTransportCapability
                      == EngineCapabilities.DspTransportCapability.VERIFIED_GLOBAL_MIX;
              return new SimpleModeModel(Prefs.outputCeilings(getContext()),
                      new ControlVolumeCurve(streamMin, streamMax), active,
                      Prefs.globalDspEnabled(getContext()), active);
          }
          ''',
          '''    private SimpleModeModel outputModel() {
              boolean verified = runtime.sessionDspActive
                      || runtime.dspTransportCapability
                      == EngineCapabilities.DspTransportCapability.VERIFIED_POLICY_SCOPED
                      || runtime.dspTransportCapability
                      == EngineCapabilities.DspTransportCapability.VERIFIED_GLOBAL_MIX;
              boolean globalMixActive = runtime.dspTransportCapability
                      == EngineCapabilities.DspTransportCapability.VERIFIED_GLOBAL_MIX;
              return new SimpleModeModel(Prefs.outputCeilings(getContext()),
                      new ControlVolumeCurve(streamMin, streamMax), verified,
                      Prefs.globalDspEnabled(getContext()), globalMixActive);
          }
          ''', 'advanced DSP status semantics')
          replace_once(advanced,
          '''    private void refreshSharedOutputControls() {
          ''',
          '''    private void refreshEnhancedSessionSetup() {
              boolean granted = getContext().checkSelfPermission(EnhancedSessionSetup.DUMP_PERMISSION)
                      == PackageManager.PERMISSION_GRANTED;
              if (!granted) {
                  sessionDspSetupStatus.setText(EnhancedSessionSetup.REQUIRED_STATUS + "\n"
                          + EnhancedSessionSetup.ADB_GRANT_COMMAND);
                  copySessionDspCommand.setVisibility(View.VISIBLE);
                  return;
              }
              copySessionDspCommand.setVisibility(View.GONE);
              sessionDspSetupStatus.setText(runtime.running
                      ? StatusText.sessionDsp(runtime)
                      : "Enhanced Session DSP permission granted · session discovery starts with playback");
          }

              private void copyEnhancedSessionCommand() {
              ClipboardManager clipboard = (ClipboardManager) getContext()
                      .getSystemService(Context.CLIPBOARD_SERVICE);
              if (clipboard != null) {
                  clipboard.setPrimaryClip(ClipData.newPlainText(
                          "SoundCeiling Enhanced Session DSP", EnhancedSessionSetup.ADB_GRANT_COMMAND));
              }
          }

              private void refreshSharedOutputControls() {
          ''', 'advanced setup methods')
          PY
          bash ./scripts/run-v077-session-telemetry-tests.sh
          bash ./scripts/run-v077-samsung-3of15-tests.sh
          bash ./scripts/run-pure-tests.sh
          ./gradlew --no-daemon :app:compileDebugJavaWithJavac
      - name: Persist Task 6 Android wiring and self-remove
        run: |
          git config user.name "darknecromancer0"
          git config user.email "127566984+darknecromancer0@users.noreply.github.com"
          git rm .github/workflows/apply-v077-task6-android.yml
          git add app/src/main/java/dev/soundceiling/app/NormalizerService.java \
                  app/src/main/java/dev/soundceiling/app/SimpleModeView.java \
                  app/src/main/java/dev/soundceiling/app/AdvancedModeView.java
          git commit -m "feat: surface enhanced session DSP setup and telemetry"
          git push origin HEAD:feature/v0.7-adaptive-envelope
