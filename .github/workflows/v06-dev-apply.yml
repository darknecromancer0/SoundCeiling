name: Apply SoundCeiling v0.6 development patch
on:
  push:
    branches: [ "feature/v0.6-one-way-adaptive" ]
    paths:
      - "scripts/v06-dev-apply.py"
      - "scripts/v06-dev-ui-apply.py"
      - ".github/workflows/v06-dev-apply.yml"
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v0.6-one-way-adaptive
          fetch-depth: 0
      - name: Apply deterministic runtime patch
        run: python scripts/v06-dev-apply.py
      - name: Apply deterministic UI patch
        run: python scripts/v06-dev-ui-apply.py
      - name: Commit patch if needed
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No patch changes"
            exit 0
          fi
          git config user.name "soundceiling-dev-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/dev/soundceiling/app tests scripts
          git commit -m "refactor: align v0.6 unified one-way UI"
          git push origin HEAD:feature/v0.6-one-way-adaptive
