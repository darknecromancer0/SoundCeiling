name: v0.6 review cleanup
on:
  push:
    branches: [ "feature/v0.6-one-way-adaptive" ]
    paths: [ ".github/workflows/v06-review-cleanup.yml" ]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v0.6-one-way-adaptive
          fetch-depth: 0
      - name: Apply reviewed Normalizer cleanup
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/dev/soundceiling/app/NormalizerService.java')
          s = p.read_text()
          duplicate = '''        } else if (controlProfile != null) {\n            out.thresholds(controlProfile.targetLoudness,\n                    manualThreshold.effectiveThreshold(controlProfile.targetLoudness),\n                    controlProfile.sourcePeakThresholdDbfs,\n                    manualThreshold.effectiveThreshold(controlProfile.sourcePeakThresholdDbfs),\n                    manualThreshold.offsetDb());\n        } else if (controlProfile != null) {\n            out.thresholds(controlProfile.targetLoudness,\n                    manualThreshold.effectiveThreshold(controlProfile.targetLoudness),\n                    controlProfile.sourcePeakThresholdDbfs,\n                    manualThreshold.effectiveThreshold(controlProfile.sourcePeakThresholdDbfs),\n                    manualThreshold.offsetDb());\n        }\n'''
          single = '''        } else if (controlProfile != null) {\n            out.thresholds(controlProfile.targetLoudness,\n                    manualThreshold.effectiveThreshold(controlProfile.targetLoudness),\n                    controlProfile.sourcePeakThresholdDbfs,\n                    manualThreshold.effectiveThreshold(controlProfile.sourcePeakThresholdDbfs),\n                    manualThreshold.offsetDb());\n        }\n'''
          assert s.count(duplicate) == 1, 'expected exactly one duplicated controlProfile threshold block'
          assert s.count('HEADER version=0.5.0 ') == 1, 'expected exactly one stale log header version'
          assert s.count('.setContentTitle("Sound Ceiling v0.5.0")') == 1, 'expected exactly one stale notification title'
          s = s.replace(duplicate, single, 1)
          s = s.replace('HEADER version=0.5.0 ', 'HEADER version=0.6.0 ', 1)
          s = s.replace('.setContentTitle("Sound Ceiling v0.5.0")', '.setContentTitle("Sound Ceiling v" + BuildConfig.VERSION_NAME)', 1)
          assert s.count('} else if (controlProfile != null) {') == 1
          assert 'HEADER version=0.5.0 ' not in s
          assert 'Sound Ceiling v0.5.0' not in s
          p.write_text(s)
          PY
      - name: Verify cleanup
        run: |
          ./scripts/run-pure-tests.sh
          ./scripts/check-source-invariants.sh
          bash ./scripts/check-v06-one-way-contract.sh
      - name: Commit reviewed cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- app/src/main/java/dev/soundceiling/app/NormalizerService.java
          git diff --cached --check
          git commit -m "fix: clean reviewed v0.6 runtime metadata"
          git push origin HEAD:feature/v0.6-one-way-adaptive
