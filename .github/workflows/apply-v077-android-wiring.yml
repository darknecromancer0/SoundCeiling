name: Apply v0.7.7 Android wiring fix
on:
  push:
    branches: [ "feature/v0.7-adaptive-envelope" ]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor == 'darknecromancer0'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v0.7-adaptive-envelope
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Prove wiring contract is RED before patch
        run: |
          if bash ./scripts/check-v077-android-wiring-contract.sh; then
            echo 'Expected pre-patch Android wiring contract to fail' >&2
            exit 1
          fi
      - name: Apply and verify exact Android wiring
        run: |
          echo ' apply")

