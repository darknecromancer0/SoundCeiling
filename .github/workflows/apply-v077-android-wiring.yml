name: Apply v0.7.7 Android wiring fix
on:
  push:
    branches: [ "feature/v0.7-adaptive-envelope" ]
permissions:
  contents: write
jobs:
  wiring:
    if: github.actor == 'darknecromancer0'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v0.7-adaptive-envelope
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Prove RED
        run: |
          if bash ./scripts/check-v077-android-wiring-contract.sh; then exit 1; fi
      - name: Patch and verify
        run: |
          python3 ./scripts/apply-v077-android-wiring.py
          bash ./scripts/check-v077-android-wiring-contract.sh
          bash ./scripts/run-v077-session-telemetry-tests.sh
          bash ./scripts/run-v077-samsung-3of15-tests.sh
          bash ./scripts/run-pure-tests.sh
          ./gradlew --no-daemon :app:compileDebugJavaWithJavac
      - name: Commit verified wiring
        run: |
          git config user.name darknecromancer0
          git config user.email 127566984+darknecromancer0@users.noreply.github.com
          git rm .github/workflows/apply-v077-android-wiring.yml scripts/apply-v077-android-wiring.py
          git add app/src/main/java/dev/soundceiling/app/NormalizerService.java app/src/main/java/dev/soundceiling/app/SimpleModeView.java app/src/main/java/dev/soundceiling/app/AdvancedModeView.java
          git commit -m "feat: wire v0.7.7 Session DSP telemetry and setup UI"
          git push origin HEAD:feature/v0.7-adaptive-envelope
