name: Materialize v0.7.7.4 release metadata
on:
  push:
    branches: [ "feature/v0.7-adaptive-envelope" ]
    paths: [ "docs/patches/v0774-release.patch" ]
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v0.7-adaptive-envelope
          fetch-depth: 0
      - name: Apply verified release patch
        run: |
          git apply --check docs/patches/v0774-release.patch
          git apply docs/patches/v0774-release.patch
          rm docs/patches/v0774-release.patch .github/workflows/materialize-v0774-release.yml
          git config user.name "SoundCeiling CI"
          git config user.email "soundceiling-ci@users.noreply.github.com"
          git add -A
          git commit -m "release: SoundCeiling v0.7.7.4"
          git push origin HEAD:feature/v0.7-adaptive-envelope
