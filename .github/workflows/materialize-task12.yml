name: Materialize Task 12 spectrum review fix
on:
  pull_request:
permissions:
  contents: write
jobs:
  materialize:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v0.7-adaptive-envelope
          fetch-depth: 0
      - name: Apply reviewed spectrum invalidation fix
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object .task12/p00)" = "37922a7e687a69df82dec7ea26ae6296ca53840f"
          git apply .task12/p00
          test "$(git hash-object app/src/main/java/dev/soundceiling/app/NormalizerService.java)" = "35b62a20acd8bc1927e36899184314fd28927048"
          test "$(git hash-object scripts/check-v071-release-contract.sh)" = "ce7ea61d7b21f23de63dc18c3988d163ef2c8a58"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/dev/soundceiling/app/NormalizerService.java scripts/check-v071-release-contract.sh
          git commit -m "fix: clear stale spectrum on capture rebind"
          git push origin HEAD:feature/v0.7-adaptive-envelope
