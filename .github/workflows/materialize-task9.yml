name: Materialize Task 9 exact sources
on:
  pull_request:
    paths:
      - '.task9/**'
      - '.github/workflows/materialize-task9.yml'
permissions:
  contents: write
jobs:
  materialize:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Apply exact local patches and self-remove
        shell: bash
        run: |
          set -euo pipefail
          git apply --check .task9/normalizer-service.patch
          git apply --check .task9/plan.patch
          git apply .task9/normalizer-service.patch
          git apply .task9/plan.patch
          test "$(git hash-object app/src/main/java/dev/soundceiling/app/NormalizerService.java)" = "532da6c075a04a42c13667fc3d2e75bd556e21db"
          test "$(git hash-object docs/superpowers/plans/2026-08-22-v0.7.1-linked-lock-global-normalization.md)" = "cf2a33d0ddfd43bc52463393b77c3cea5a5a610b"
          git rm -r .task9
          git rm .github/workflows/materialize-task9.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/dev/soundceiling/app/NormalizerService.java docs/superpowers/plans/2026-08-22-v0.7.1-linked-lock-global-normalization.md
          git commit -m "feat: add global dsp mode and shared linked lock"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
