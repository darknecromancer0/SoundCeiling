name: Materialize v0.7.7.5 emergency safety hotfix
on:
  push:
    branches: [ "feature/v0.7-adaptive-envelope" ]
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v0.7-adaptive-envelope
          fetch-depth: 0
      - name: Apply emergency safety patch
        run: |
          if [ ! -f docs/patches/v0775-emergency-safety.patch ]; then
            echo "patch already materialized"
            exit 0
          fi
          git apply --check docs/patches/v0775-emergency-safety.patch
          git apply docs/patches/v0775-emergency-safety.patch
          rm docs/patches/v0775-emergency-safety.patch
          bash ./scripts/check-v0773-preenable-sanitization-contract.sh
          bash ./scripts/check-v0773-release-contract.sh
          bash ./scripts/run-v0771-readback-tests.sh
          bash ./scripts/check-v0771-readback-wiring-contract.sh
          git config user.name "SoundCeiling CI"
          git config user.email "soundceiling-ci@users.noreply.github.com"
          git add -A
          git commit -m "fix: emergency rollback unsafe Samsung Session DSP"
          git push origin HEAD:feature/v0.7-adaptive-envelope
