name: Apply v0.7.6.3 source corrective
on:
  push:
    branches: [ "feature/v0.7-adaptive-envelope" ]
permissions:
  contents: write
jobs:
  patch-source:
    if: github.actor == 'darknecromancer0'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v0.7-adaptive-envelope
          fetch-depth: 0
      - name: Apply bounded DSP attach evidence fix
        run: |
          python3 - <<'PY'
          from pathlib import Path

          verifier = Path('app/src/main/java/dev/soundceiling/app/DspDifferentialVerifier.java')
          s = verifier.read_text()
          old = '''        AttachResult(boolean safe, float deltaDb, int baselinePairs, int attachPairs,\n                     long coveredMs, String reason) {\n            this.safe = safe;\n            this.deltaDb = deltaDb;\n            this.baselinePairs = baselinePairs;\n            this.attachPairs = attachPairs;\n            this.coveredMs = Math.max(0L, coveredMs);\n            this.reason = reason == null ? "" : reason;\n        }\n'''
          new = old + '''\n        boolean retryable() {\n            return "attach_insufficient_pairs".equals(reason)\n                    || "attach_insufficient_coverage".equals(reason);\n        }\n'''
          if 'boolean retryable()' not in s:
              if old not in s: raise SystemExit('verifier patch anchor missing')
              verifier.write_text(s.replace(old, new, 1))

          service = Path('app/src/main/java/dev/soundceiling/app/NormalizerService.java')
          s = service.read_text()
          timing_old = '''            globalDifferentialTransportAttached = true;\n            globalDifferentialAttachFirstMs = nowMs;\n            globalProbeStartedAtMs = nowMs;\n'''
          timing_new = '''            globalDifferentialTransportAttached = true;\n            long attachedAtMs = SystemClock.elapsedRealtime();\n            globalDifferentialAttachFirstMs = attachedAtMs;\n            globalProbeStartedAtMs = attachedAtMs;\n'''
          if 'long attachedAtMs = SystemClock.elapsedRealtime();' not in s:
              if timing_old not in s: raise SystemExit('attach timing patch anchor missing')
              s = s.replace(timing_old, timing_new, 1)

          logic_old = '''            DspDifferentialVerifier.AttachResult attach =\n                    optionalDsp.evaluateGlobalNeutralAttach(nowMs);\n            DiagnosticLog.transition("dsp_global_attach_result", attach.reason,\n                    "safe=" + attach.safe + " deltaDb=" + attach.deltaDb\n                            + " samples=" + attach.attachPairs);\n            if (!attach.safe) {\n                optionalDsp.cancelGlobalDifferentialProbe("neutral_attach_non_neutral");\n                suppressGlobalProbeForRoute("neutral_attach_non_neutral:" + attach.deltaDb, nowMs);\n                DiagnosticLog.transition("dsp_global_attach_unsafe", "neutral_attach_non_neutral",\n                        "deltaDb=" + attach.deltaDb + " detached=true route="\n                                + DeviceDetector.key(currentDevice));\n                resetGlobalDifferentialState();\n                return;\n            }\n'''
          logic_new = '''            DspDifferentialVerifier.AttachResult attach =\n                    optionalDsp.evaluateGlobalNeutralAttach(nowMs);\n            DiagnosticLog.transition("dsp_global_attach_result", attach.reason,\n                    "safe=" + attach.safe + " retryable=" + attach.retryable()\n                            + " deltaDb=" + attach.deltaDb\n                            + " coveredMs=" + attach.coveredMs\n                            + " samples=" + attach.attachPairs);\n            if (attach.retryable()) {\n                DiagnosticLog.transition("dsp_global_attach_wait", attach.reason,\n                        "coveredMs=" + attach.coveredMs + " samples=" + attach.attachPairs\n                                + " timeoutRemainingMs="\n                                + Math.max(0L, GLOBAL_DSP_PROBE_MAX_ACTIVE_MS\n                                - (nowMs - globalProbeStartedAtMs)));\n                return;\n            }\n            if (!attach.safe) {\n                optionalDsp.cancelGlobalDifferentialProbe("neutral_attach_non_neutral");\n                suppressGlobalProbeForRoute("neutral_attach_non_neutral:" + attach.deltaDb, nowMs);\n                DiagnosticLog.transition("dsp_global_attach_unsafe", "neutral_attach_non_neutral",\n                        "deltaDb=" + attach.deltaDb + " detached=true route="\n                                + DeviceDetector.key(currentDevice));\n                resetGlobalDifferentialState();\n                return;\n            }\n'''
          if 'if (attach.retryable()) {' not in s:
              if logic_old not in s: raise SystemExit('attach decision patch anchor missing')
              s = s.replace(logic_old, logic_new, 1)
          service.write_text(s)
          PY
      - name: Persist source fix
        run: |
          if git diff --quiet; then
            echo "Source already patched"
            exit 0
          fi
          git config user.name "darknecromancer0"
          git config user.email "127566984+darknecromancer0@users.noreply.github.com"
          git add app/src/main/java/dev/soundceiling/app/DspDifferentialVerifier.java app/src/main/java/dev/soundceiling/app/NormalizerService.java
          git commit -m "fix: keep inconclusive DSP attach evidence retryable"
          git push origin HEAD:feature/v0.7-adaptive-envelope
