name: Finalize SoundCeiling v0.7.7 release
on:
  push:
    branches: [ "feature/v0.7-adaptive-envelope" ]
permissions:
  contents: write
jobs:
  finalize:
    if: github.actor == 'darknecromancer0'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v0.7-adaptive-envelope
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Finalize v0.7.7 docs and release workflow
        run: |
          python3 - <<'PY'
          from pathlib import Path

          readme = Path('README.md')
          s = readme.read_text()
          s = s.replace('# Sound Ceiling for Android - v0.7.6.3', '# Sound Ceiling for Android - v0.7.7', 1)
          old_intro = ('SoundCeiling is a no-root Android 10+ adaptive audio controller. v0.7.6.3 is a Samsung DSP attach-evidence corrective built on the **Control Architecture Reset** from v0.7.6, the DSP attach safety work from v0.7.6.1, and the output-domain correction from v0.7.6.2.')
          new_intro = ('SoundCeiling is a no-root Android 10+ adaptive audio controller. v0.7.7 moves ordinary normalization to verified **Enhanced Session DSP** on an exact non-zero playback audio session while keeping the Samsung Media slider as the user master anchor.')
          if old_intro in s:
              s = s.replace(old_intro, new_intro, 1)
          marker = '## v0.7.6.3 Samsung DSP attach evidence corrective\n'
          section = '''## v0.7.7 Enhanced Session DSP\n\n- **Non-zero session authority.** Ordinary normalization may use DSP only after SoundCeiling discovers exactly one active non-zero audio session owned by the exact playback UID and verifies its audible differential response. Session 0 is not used as the v0.7.7 normalizer target.\n- **Samsung Media remains user authority.** Media 3/15 is a first-class user anchor. Ordinary normalization must not pull the Samsung slider away from 3/15, 2/15, or another manual step. With verified Session DSP, correction is continuous DSP gain; without it, ordinary normalization holds.\n- **One-time no-root setup.** Enhanced session discovery requires the Android DUMP permission granted once from ADB: `adb shell pm grant dev.soundceiling.app android.permission.DUMP`. Simple and Advanced modes expose setup status and a copyable command.\n- **Fail-closed transport.** A stale, ambiguous, non-neutral, unresponsive, or failed session transport is released. A failed gain apply revokes Session DSP authority and returns ordinary control to HOLD rather than reviving target-chasing Media fallback.\n- **Diagnostics expose the real actuator.** Runtime state and logs include session ID, UID, package, requested/applied gain, reason, and `session_dsp_apply`.\n- The historical Safety Maximum, Quiet Now, source-policy gates, user-master anchor, debt-only recovery, stop/restart protection, and v0.7.6.x output-domain safety contracts remain intact.\n\nSamsung physical acceptance: `docs/field-tests/2026-08-25-v0.7.7-samsung-checklist.md`.\n\n'''
          if '## v0.7.7 Enhanced Session DSP' not in s:
              if marker not in s:
                  raise SystemExit('README v0.7.6.3 marker missing')
              s = s.replace(marker, section + marker, 1)
          old_release = 'Release artifact: **`SoundCeiling-v0.7.6.3-debug-apk`**, containing `app-debug.apk`.'
          new_release = 'Release artifact: **`SoundCeiling-v0.7.7-debug-apk`**, containing `app-debug.apk`.'
          if old_release in s:
              s = s.replace(old_release, new_release, 1)
          readme.write_text(s)

          wf = Path('.github/workflows/build-apk.yml')
          w = wf.read_text()
          anchor = '''      - name: Check v0.7.7 Session DSP telemetry\n        run: bash ./scripts/run-v077-session-telemetry-tests.sh\n      - uses: android-actions/setup-android@v4\n'''
          replacement = '''      - name: Check v0.7.7 Session DSP telemetry\n        run: bash ./scripts/run-v077-session-telemetry-tests.sh\n      - name: Check v0.7.7 release contract\n        run: bash ./scripts/check-v077-release-contract.sh\n      - uses: android-actions/setup-android@v4\n'''
          if 'run: bash ./scripts/check-v077-release-contract.sh' not in w:
              if anchor not in w:
                  raise SystemExit('build workflow v0.7.7 telemetry anchor missing')
              w = w.replace(anchor, replacement, 1)
          w = w.replace('name: SoundCeiling-v0.7.6.3-debug-apk', 'name: SoundCeiling-v0.7.7-debug-apk')
          wf.write_text(w)
          PY
          bash ./scripts/check-v077-release-contract.sh
          bash ./scripts/run-v077-samsung-3of15-tests.sh
          bash ./scripts/run-v077-session-telemetry-tests.sh
          bash ./scripts/run-pure-tests.sh
          ./gradlew --no-daemon :app:compileDebugJavaWithJavac
      - name: Commit final v0.7.7 release state
        run: |
          git config user.name darknecromancer0
          git config user.email 127566984+darknecromancer0@users.noreply.github.com
          git rm .github/workflows/finalize-v077-release.yml
          git add README.md .github/workflows/build-apk.yml
          git commit -m "release: finalize SoundCeiling v0.7.7 Session DSP build"
          git push origin HEAD:feature/v0.7-adaptive-envelope
