name: Finalize SoundCeiling v0.7.7 release
on:
  push:
    branches: [ "feature/v0.7-adaptive-envelope" ]
permissions:
  contents: write
jobs:
  finalize:
    if: github.actor == 'darknecromancer0'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v0.7-adaptive-envelope
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Finalize and verify release state
        run: |
          python3 ./scripts/finalize-v077-release.py
          bash ./scripts/check-v077-release-contract.sh
          bash ./scripts/check-v077-android-wiring-contract.sh
          bash ./scripts/run-v077-samsung-3of15-tests.sh
          bash ./scripts/run-v077-session-telemetry-tests.sh
          bash ./scripts/run-pure-tests.sh
          ./gradlew --no-daemon :app:compileDebugJavaWithJavac
      - name: Commit verified release state
        run: |
          git config user.name darknecromancer0
          git config user.email 127566984+darknecromancer0@users.noreply.github.com
          git rm .github/workflows/finalize-v077-release.yml scripts/finalize-v077-release.py
          git add README.md .github/workflows/build-apk.yml
          git commit -m "release: finalize SoundCeiling v0.7.7 Session DSP build"
          git push origin HEAD:feature/v0.7-adaptive-envelope
