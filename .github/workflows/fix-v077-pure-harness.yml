name: Fix v0.7.7 pure harness dependency
on:
  push:
    branches: [ "feature/v0.7-adaptive-envelope" ]
permissions:
  contents: write
jobs:
  fix-harness:
    if: github.actor == 'darknecromancer0'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v0.7-adaptive-envelope
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Add EnhancedSessionSetup to pure compile set
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/run-pure-tests.sh')
          s = p.read_text()
          line = ' "$ROOT/app/src/main/java/dev/soundceiling/app/EnhancedSessionSetup.java" \\\n'
          anchor = ' "$ROOT/app/src/main/java/dev/soundceiling/app/StatusText.java" \\\n'
          if 'EnhancedSessionSetup.java' not in s:
              if anchor not in s:
                  raise SystemExit('StatusText compile anchor missing')
              s = s.replace(anchor, line + anchor, 1)
              p.write_text(s)
          PY
          bash ./scripts/run-pure-tests.sh
          bash ./scripts/run-v077-session-telemetry-tests.sh
          bash ./scripts/run-v077-samsung-3of15-tests.sh
          ./gradlew --no-daemon :app:compileDebugJavaWithJavac
      - name: Persist harness fix and self-remove
        run: |
          git config user.name darknecromancer0
          git config user.email 127566984+darknecromancer0@users.noreply.github.com
          git rm .github/workflows/fix-v077-pure-harness.yml
          git add scripts/run-pure-tests.sh
          git commit -m "test: compile v0.7.7 setup dependency in pure suite"
          git push origin HEAD:feature/v0.7-adaptive-envelope
